# Desired state for Cloudflare Zero Trust Gateway lists.
# Personal files always win over remote sources.

plan:
  max_items: 300000
  items_per_list: 1000
  list_name_prefix: gateway-list

sources:
  allow:
    - id: personal
      path: allowlist/personal.txt
      priority: 100
      required: true

  block:
    - id: personal-block
      path: blocklist/personal.txt
      priority: 90
      required: true
    - id: oisd-small
      url: https://small.oisd.nl/
      format: adblock
      priority: 40
      required: true
    - id: hagezi-light
      url: https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/light.txt
      format: adblock
      priority: 30
      required: true

  # Tried in priority order (high first). compile ignores this group.
  asn:
    - id: geolite2-asn
      url: https://git.io/GeoLite2-ASN.mmdb
      format: mmdb
      priority: 20
      required: true
    - id: geolite2-asn-github
      url: https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-ASN.mmdb
      format: mmdb
      priority: 10
      required: false

safety:
  abort_if_source_shrinks_pct: 40
  abort_if_allowlist_shrinks: 10
  abort_if_adds_over: 50000
  require_review_if_removes_over: 1000

policies:
  allow:
    name: gateway-list:allow
    precedence: 1000
  security:
    name: gateway-list:security
    precedence: 2000
    enabled: true
  block:
    name: gateway-list:block
    precedence: 3000
  # Network (l4) pack on the same DOMAIN lists. No-op without WARP + Gateway TCP proxy.
  # Precedence is unique across DNS and Network (not per tab).
  network:
    enabled: false
    allow:
      name: gateway-list:net:allow
      precedence: 1100
    security:
      name: gateway-list:net:security
      precedence: 2100
      enabled: true
    block:
      name: gateway-list:net:block
      precedence: 3100
